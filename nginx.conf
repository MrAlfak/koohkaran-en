server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Legacy path → root
    location = /koohkaran {
        return 301 /;
    }
    location /koohkaran/ {
        rewrite ^/koohkaran/(.*)$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
